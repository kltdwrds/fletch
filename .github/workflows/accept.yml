name: accept
# A part's acceptance on a runner: the same `pnpm accept F<n>` a builder runs on its own machine, for a machine too
# loaded to run the hermetic suite in one pass (a laptop with several sessions on it times the browser tests out).
# Dispatched by hand for one branch and one part; it deploys nothing and writes nothing back. The ACCEPT line in the
# job's log, with its TREE line, is the one the builder quotes, and the whole log is the run's artifact.
#   gh workflow run accept.yml --ref <branch> -f part=F<n>
on:
  workflow_dispatch:
    inputs:
      part:
        description: "The part, F<n>"
        required: true
        type: string

permissions:
  contents: read

jobs:
  accept:
    runs-on: ubuntu-latest
    name: accept ${{ inputs.part }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright-core --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium for the UI tests
        run: pnpm exec playwright-core install --with-deps chromium
      # The part id goes through the environment, never into the script: an input is text from whoever dispatched.
      # The log is written whole and printed after, never piped, so the exit status is accept's own.
      - name: Accept (pnpm accept)
        env:
          PART: ${{ inputs.part }}
        run: |
          set -uo pipefail
          [[ "$PART" =~ ^F[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::part must be F<n>, got '$PART'"; exit 2; }
          pnpm accept "$PART" > accept.log 2>&1
          rc=$?
          cat accept.log
          echo "accept exit $rc"
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accept-${{ inputs.part }}-${{ github.sha }}
          path: accept.log
