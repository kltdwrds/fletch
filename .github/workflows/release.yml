name: release
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  # The same environment as ci.yml: no registry auth and no OIDC token, which the hermetic test lane refuses to run beside.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright-core --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium for the UI tests
        run: pnpm exec playwright-core install --with-deps chromium
      - name: Verify before publishing
        env:
          CHECK_FILE_SIZES_BASE: ${{ github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '' }}
        run: pnpm verify

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # Without NPM_TOKEN nothing can be published: say so as a warning and skip publishing, so the run stays green
      # until the secret is added.
      - name: Check for NPM_TOKEN
        id: npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::warning::NPM_TOKEN is not set, so nothing was published; add it as a repository secret to release"
            echo "token=absent" >> "$GITHUB_OUTPUT"
          else
            echo "token=present" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.npm.outputs.token == 'present'
        uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
