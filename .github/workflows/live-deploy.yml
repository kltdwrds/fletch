name: live-deploy
# The F1 exit test: a real deploy into a throwaway Cloudflare account, then cleanup. Never part of `ci`;
# it runs by hand or when a release is published, and needs two repository secrets:
#   CF_LIVE_ACCOUNT_ID   the throwaway account's id
#   CF_LIVE_TOKEN        an API token for it (Workers Scripts, R2, Vectorize: Edit; Workers AI: Read)
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency: live-deploy

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require the throwaway account
        env:
          CF_LIVE_ACCOUNT_ID: ${{ secrets.CF_LIVE_ACCOUNT_ID }}
          CF_LIVE_TOKEN: ${{ secrets.CF_LIVE_TOKEN }}
        run: |
          missing=""
          [ -n "$CF_LIVE_ACCOUNT_ID" ] || missing="$missing CF_LIVE_ACCOUNT_ID"
          [ -n "$CF_LIVE_TOKEN" ] || missing="$missing CF_LIVE_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::the live deploy needs these repository secrets:$missing. Add them under Settings, Secrets and variables, Actions."
            exit 1
          fi
      - name: The ten-minute path
        env:
          QYVR_LIVE: "1"
          CF_LIVE_ACCOUNT_ID: ${{ secrets.CF_LIVE_ACCOUNT_ID }}
          CF_LIVE_TOKEN: ${{ secrets.CF_LIVE_TOKEN }}
        run: pnpm vitest run test/live/f1-deploy.live.test.ts
      - name: Sweep fletch-ci- leftovers
        # A cancelled, crashed or timed-out run skips its own cleanup; this deletes every fletch-ci- resource, and only those.
        if: always()
        env:
          CF_LIVE_ACCOUNT_ID: ${{ secrets.CF_LIVE_ACCOUNT_ID }}
          CF_LIVE_TOKEN: ${{ secrets.CF_LIVE_TOKEN }}
        run: node --conditions=development scripts/live-sweep.ts --report-only
