name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright-core --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium for the UI tests
        run: pnpm exec playwright-core install --with-deps chromium
      # check (lint, the harness checks and scans, typecheck), then the tests. The file-size ratchet compares with the
      # merge base of origin/main, which fetch-depth 0 brings; a push to main compares with the commit before it.
      - name: Verify
        env:
          CHECK_FILE_SIZES_BASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '' }}
        run: pnpm verify
      - name: DCO sign-off
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            range="$PUSH_HEAD"
          else
            range="$PUSH_BEFORE..$PUSH_HEAD"
          fi
          # --min-parents=1 leaves out the root commit (GitHub's "Initial commit", unsigned);
          # merge commits carry no sign-off of their own.
          failed=0
          shas=$(git rev-list --min-parents=1 --max-parents=1 "$range")
          for sha in $shas; do
            if ! git show -s --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::commit $sha has no Signed-off-by trailer (use git commit -s)"
              failed=1
            fi
          done
          exit "$failed"
